<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上海医疗服务价格映射</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: #f0f2f5;
  color: #333;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
}

.header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  color: white;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 {
  font-size: 1.4em;
  font-weight: 600;
  letter-spacing: 1px;
}
.header .subtitle {
  font-size: 0.85em;
  opacity: 0.8;
}
.stats-bar {
  display: flex;
  gap: 20px;
  font-size: 0.8em;
}
.stats-bar span {
  background: rgba(255,255,255,0.12);
  padding: 4px 12px;
  border-radius: 12px;
}
.stats-bar .highlight {
  background: rgba(255,215,0,0.2);
  color: #ffd700;
}

.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 8px;
  height: calc(100vh - 80px);
  width: 100%;
  box-sizing: border-box;
}

.panel {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 10px 14px;
  font-weight: 600;
  font-size: 0.9em;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-header .count {
  font-size: 0.75em;
  opacity: 0.85;
  font-weight: 400;
}
.sh .panel-header { background: #2563eb; }
.ts .panel-header { background: #d97706; }
.icd9 .panel-header { background: #dc2626; }

.panel-search {
  padding: 8px 10px;
  border-bottom: 1px solid #e5e7eb;
}
.panel-search input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 0.85em;
  outline: none;
  transition: border-color 0.2s;
}
.sh .panel-search input:focus { border-color: #2563eb; }
.ts .panel-search input:focus { border-color: #d97706; }
.icd9 .panel-search input:focus { border-color: #dc2626; }

.panel-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
.panel-item {
  padding: 8px 14px;
  cursor: pointer;
  border-bottom: 1px solid #f3f4f6;
  font-size: 0.8em;
  transition: background 0.15s;
  position: relative;
}
.panel-item:hover { background: #f9fafb; }
.panel-item.active {
  background: #eff6ff;
  border-left: 3px solid #3b82f6;
}
.panel-item.linked {
  background: #fef3c7;
  border-left: 3px solid #f59e0b;
}
.panel-item .item-name {
  font-weight: 500;
  color: #1f2937;
  line-height: 1.4;
}
.panel-item .item-code {
  font-size: 0.85em;
  color: #6b7280;
  margin-top: 2px;
}
.panel-item .item-meta {
  font-size: 0.8em;
  color: #9ca3af;
  margin-top: 2px;
}
.badge-sh { background: #2563eb; }
.badge-ts { background: #d97706; }
.badge-icd9 { background: #dc2626; }
.badge-linked { background: #8b5cf6; }

.empty-state {
  text-align: center;
  color: #9ca3af;
  padding: 40px 20px;
  font-size: 0.85em;
}

/* Scrollbar */
.panel-list::-webkit-scrollbar { width: 4px; }
.panel-list::-webkit-scrollbar-track { background: transparent; }
.panel-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

@media (max-width: 1200px) {
  .container { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .container { grid-template-columns: 1fr; height: auto; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>上海医疗服务价格映射</h1>
    <div class="subtitle">上海价格项目 → 2023技术规范 → ICD-9-CM3 编码</div>
  </div>
  <div class="stats-bar">
    <span>上海项目: <strong id="stat-sh">0</strong></span>
    <span>技术规范: <strong id="stat-ts">0</strong></span>
    <span>ICD-9编码: <strong id="stat-icd9">0</strong></span>
  </div>
</div>

<div class="container">
  <!-- Shanghai Panel -->
  <div class="panel sh">
    <div class="panel-header">
      <span>📋 上海价格项目</span>
      <span class="count" id="sh-count">加载中...</span>
    </div>
    <div class="panel-search">
      <input type="text" placeholder="搜索名称、编码..." data-target="shanghai" data-panel="sh">
    </div>
    <div class="panel-list" id="list-shanghai"></div>
  </div>

  <!-- Tech Specs Panel -->
  <div class="panel ts">
    <div class="panel-header">
      <span>🔧 2023技术规范</span>
      <span class="count" id="ts-count">加载中...</span>
    </div>
    <div class="panel-search">
      <input type="text" placeholder="搜索名称、编码..." data-target="tech_specs" data-panel="ts">
    </div>
    <div class="panel-list" id="list-tech_specs"></div>
  </div>

  <!-- ICD-9 Panel -->
  <div class="panel icd9">
    <div class="panel-header">
      <span>🏷️ ICD-9-CM3 编码</span>
      <span class="count" id="icd9-count">加载中...</span>
    </div>
    <div class="panel-search">
      <input type="text" placeholder="搜索名称、编码..." data-target="icd9" data-panel="icd9">
    </div>
    <div class="panel-list" id="list-icd9"></div>
  </div>
</div>

<script>
var DATA=null, LINKED_CACHE={};

// Load data
fetch('/api/data').then(r=>r.json()).then(d=>{
  DATA=d;
  document.getElementById('stat-sh').textContent=d.shanghai.length;
  document.getElementById('stat-ts').textContent=d.tech_specs.length;
  document.getElementById('stat-icd9').textContent=d.icd9.length;
  renderList('shanghai', d.shanghai, 'sh');
  renderList('tech_specs', d.tech_specs, 'ts');
  renderList('icd9', d.icd9, 'icd9');
}).catch(e=>console.error('Load error:',e));

function renderList(table, items, panelClass){
  var list=document.getElementById('list-'+table);
  if(!items||!items.length){list.innerHTML='<div class="empty-state">暂无数据</div>';return;}
  // Show top 200 initially
  var html='';
  for(var i=0;i<Math.min(items.length,200);i++){
    var item=items[i];
    var name=item.name||item.title||'未命名';
    var code=item.code||item.seq||item.yb_code||item.gl_code||'';
    var badgeClass=panelClass==='sh'?'badge-sh':(panelClass==='ts'?'badge-ts':'badge-icd9');
    html+='<div class="panel-item" data-id="'+item.id+'" data-table="'+table+'">'+
      '<div class="item-name"><span class="badge '+badgeClass+'">'+code+'</span> '+name+'</div>'+
      '<div class="item-meta">'+(item.desc||item.output||'')+'</div>'+
    '</div>';
  }
  if(items.length>200) html+='<div style="padding:8px;text-align:center;color:#9ca3af;font-size:.75em">共'+items.length+'条，显示前200条</div>';
  list.innerHTML=html;
}

// Search on input
document.querySelectorAll('.panel-search input').forEach(function(inp){
  inp.addEventListener('input',function(){
    var query=this.value.trim();
    var target=this.dataset.target;
    if(!query){renderList(target,DATA[target],this.dataset.panel);return;}
    fetch('/api/search?q='+encodeURIComponent(query)+'&table='+target)
      .then(r=>r.json())
      .then(d=>{
        var list=document.getElementById('list-'+target);
        if(!d.results.length){list.innerHTML='<div class="empty-state">无匹配结果</div>';return;}
        var html='';
        for(var i=0;i<d.results.length;i++){
          var r=d.results[i];
          var item=r.item;
          var name=item.name||item.title||'未命名';
          var code=item.code||item.seq||item.yb_code||item.gl_code||'';
          var badgeClass=target==='shanghai'?'badge-sh':(target==='tech_specs'?'badge-ts':'badge-icd9');
          html+='<div class="panel-item" data-id="'+item.id+'" data-table="'+target+'">'+
            '<div class="item-name"><span class="badge '+badgeClass+'">'+code+'</span> '+name+'</div>'+
            '<div class="item-meta">'+(item.desc||item.output||'')+'</div>'+
          '</div>';
        }
        list.innerHTML=html;
      });
  });
});

// Click item -> show linked
document.querySelectorAll('.panel-item').forEach(function(item){
  item.addEventListener('click',function(){
    var id=this.dataset.id;
    var table=this.dataset.table;
    handleClick(id, table);
  });
});

function handleClick(id, table){
  // Remove old active
  document.querySelectorAll('.panel-item.active').forEach(function(el){el.classList.remove('active');});
  this.classList.add('active');

  if(LINKED_CACHE[id]){
    showLinked(LINKED_CACHE[id]);
    return;
  }
  fetch('/api/linked?id='+encodeURIComponent(id)+'&table='+table)
    .then(r=>r.json())
    .then(data=>{
      LINKED_CACHE[id]=data;
      showLinked(data);
    });
}

function showLinked(data){
  var stats=data.stats||{};
  // Highlight linked items in each panel
  ['shanghai','tech_specs','icd9'].forEach(function(t){
    var list=document.getElementById('list-'+t);
    var directIds=data.direct_ids[t]||[];
    list.querySelectorAll('.panel-item').forEach(function(el){
      el.classList.remove('linked');
      if(directIds.indexOf(el.dataset.id)>=0){
        el.classList.add('linked');
      }
    });
  });
}
</script>
</body>
</html>
